services:
  # Backend API Service
  - type: web
    name: kmo24-backend
    env: node
    region: frankfurt
    plan: starter
    buildCommand: cd backend && npm install --omit=dev --prefer-offline --no-audit
    startCommand: cd backend && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_VERSION
        value: v1
      - key: MONGODB_URI
        value: mongodb+srv://omlineadmin:5MOHI036wc4yf3vh@kmo24.e0o4igm.mongodb.net/kmo24?retryWrites=true&w=majority&appName=kmo24
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW
        value: 15
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: CORS_ORIGIN
        value: https://kmo24-frontend.onrender.com
      - key: DL_API_KEY
        value: 6CA4665F-F1F1-40AF-BF06-E3CD2B452599
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: UPLOADS_PATH
        value: /var/data/uploads
      - key: LOG_LEVEL
        value: info
      # Telegram Bot для уведомлений о заказах
      - key: TELEGRAM_BOT_TOKEN
        value: "" # Токен бота из @BotFather
      - key: TELEGRAM_NOTIFY_GROUP_ID
        value: "" # ID группы для уведомлений (например: -1001234567890)
      # CRM интеграция
      - key: CRM_ENABLED
        value: "false" # Установите "true" для включения CRM
      - key: CRM_PROVIDER
        value: "bitrix24" # amocrm, bitrix24 или custom
      - key: CRM_API_URL
        value: "" # URL API CRM (webhook для Bitrix24)
      - key: CRM_API_KEY
        value: "" # API ключ (для AmoCRM)
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 10

  # Frontend SSR Service
  - type: web
    name: kmo24-frontend
    env: node
    region: frankfurt
    plan: starter
    buildCommand: cd frontend && npm install --include=dev --ignore-scripts --prefer-offline --no-audit && npm run build
    startCommand: cd frontend && node .output/server/index.mjs
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NUXT_PUBLIC_API_BASE_URL
        value: https://kmo24-backend.onrender.com/api/v1
      - key: NUXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: kmo24-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Redis Cache Service
  - type: redis
    name: kmo24-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
